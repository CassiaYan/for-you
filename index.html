<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Story</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
      background: #f7f3ed;
      color: #2f2a26;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .page {
      width: min(680px, 100%);
      min-height: 620px;
      background: #fffdf9;
      border: 1px solid #e8dfd4;
      box-shadow: 0 20px 60px rgba(60, 45, 30, 0.10);
      padding: 70px 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .page::before,
    .page::after {
      content: "✦";
      position: absolute;
      font-size: 14px;
      color: #b9a99a;
    }

    .page::before {
      top: 28px;
      left: 30px;
    }

    .page::after {
      bottom: 28px;
      right: 30px;
    }

    .content {
      width: 100%;
      max-width: 500px;
    }

    .english {
      font-size: 16px;
      letter-spacing: 2px;
      color: #85766a;
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 46px);
      font-weight: 400;
      margin: 0 0 28px;
      letter-spacing: 1px;
    }

    .intro {
      font-size: 18px;
      line-height: 2;
      margin-bottom: 34px;
    }

    .hint {
      font-size: 13px;
      color: #9a8d82;
      margin-top: 18px;
    }

    input {
      width: min(100%, 390px);
      padding: 15px 18px;
      border: none;
      border-bottom: 1px solid #9d8f83;
      background: transparent;
      outline: none;
      text-align: center;
      font-family: inherit;
      font-size: 18px;
      color: #2f2a26;
    }

    input:focus {
      border-bottom-color: #4d443d;
    }

    button {
      display: block;
      margin: 30px auto 0;
      padding: 13px 30px;
      border: 1px solid #5d534b;
      background: transparent;
      color: #3b342f;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button:hover {
      background: #3b342f;
      color: #fffdf9;
    }

    .error {
      height: 22px;
      margin-top: 15px;
      color: #9b6258;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .heart {
      font-size: 28px;
      margin-bottom: 24px;
    }

    .birthday {
      font-size: clamp(32px, 7vw, 52px);
      font-weight: 400;
      margin-bottom: 30px;
    }

    .page-number {
      font-size: 18px;
      line-height: 2;
      margin-bottom: 25px;
    }

    .message {
      font-size: 20px;
      line-height: 2;
      margin-bottom: 30px;
    }

    .signature {
      font-size: 16px;
      letter-spacing: 1.5px;
      color: #75675c;
      margin-bottom: 34px;
    }

    .continue {
      font-style: italic;
      font-size: 15px;
      color: #9a8d82;
      letter-spacing: 1px;
    }

    .fade-in {
      animation: fadeIn 1.2s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      .page {
        min-height: 580px;
        padding: 55px 25px;
      }

      .intro {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 输入页面 -->
    <section id="loginPage" class="content">
      <div class="english">To the person who is reading this...</div>

      <h1>有一个故事，<br>只有你知道答案。</h1>

      <p class="intro">
        请输入你从书签里找到的那句话
      </p>

      <input
        id="answer"
        type="text"
        placeholder="________________"
        autocomplete="off"
      >

      <button onclick="openStory()">OPEN THE STORY</button>

      <div id="error" class="error"></div>

      <div class="hint">有些答案，藏在开始的地方。</div>
    </section>


    <!-- 生日祝福页面 -->
    <section id="storyPage" class="content hidden">
      <div class="heart">♡</div>

      <div class="english">You found it.</div>

      <h1 class="birthday">生日快乐。</h1>

      <div class="page-number">
        这是我们故事里的第 314 页。
      </div>

      <div class="message">
        很高兴这一页，<br>
        是和你一起写的。
      </div>

      <div class="signature">
        Happy Birthday, my love.
      </div>

      <div class="continue">
        And the story continues...
      </div>
    </section>

  </main>

  <script>
    // ================================
    // 在这里修改你的答案
    // ================================
    const correctAnswer = "今天写下你的故事";

    // ================================
    // 点击按钮后的逻辑
    // ================================
    function openStory() {
      const input = document.getElementById("answer");
      const error = document.getElementById("error");
      const loginPage = document.getElementById("loginPage");
      const storyPage = document.getElementById("storyPage");

      const userAnswer = input.value.trim();

      if (userAnswer === correctAnswer) {
        error.textContent = "";

        loginPage.classList.add("hidden");
        storyPage.classList.remove("hidden");
        storyPage.classList.add("fade-in");

      } else {
        error.textContent = "再想一想 ♡";
        input.value = "";
        input.focus();
      }
    }

    // 按 Enter 也可以提交
    document.getElementById("answer").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        openStory();
      }
    });
  </script>

</body>
</html>
